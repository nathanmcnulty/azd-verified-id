name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-azd@v2
      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.6.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22.0 -Scope CurrentUser -Force
      - name: Install Bicep
        shell: bash
        run: az bicep install
      - name: Validate repository
        shell: pwsh
        run: ./scripts/Test-Repository.ps1
