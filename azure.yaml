# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: azd-verified-id
metadata:
  template: azd-verified-id@0.1.0
infra:
  provider: bicep
  path: infra
requiredVersions:
  azd: ">= 1.23.0"
hooks:
  preup:
    windows:
      shell: pwsh
      run: ./scripts/initialize-environment.ps1
    posix:
      shell: pwsh
      run: ./scripts/initialize-environment.ps1
  preinfracreate:
    windows:
      shell: pwsh
      run: ./scripts/initialize-environment.ps1
    posix:
      shell: pwsh
      run: ./scripts/initialize-environment.ps1
  preprovision:
    windows:
      shell: pwsh
      run: ./scripts/preprovision.ps1
    posix:
      shell: pwsh
      run: ./scripts/preprovision.ps1
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/postprovision.ps1
    posix:
      shell: pwsh
      run: ./scripts/postprovision.ps1
  predown:
    windows:
      shell: pwsh
      run: ./scripts/predown.ps1
    posix:
      shell: pwsh
      run: ./scripts/predown.ps1
